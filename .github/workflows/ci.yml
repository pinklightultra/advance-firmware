name: Advance Firmware CI

on:
  push:
    branches:
      - feat/desktop-sdl2-adapter
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: C++ Test Suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libsdl2-dev \
            libasound2-dev

      - name: Configure CMake Tests
        run: |
          cmake -S tests -B build_tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Tests
        run: |
          ninja -C build_tests picoTracker_tests -j $(nproc)

      - name: Run C++ Unit Tests
        run: |
          ./build_tests/picoTracker_tests
