name: Build
on: 
  push:
    paths:
      - sources/**
      - .github/workflows/**

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Checkout submodules (pico-sdk)
      working-directory: ${{github.workspace}}
      run: git submodule update --init --recursive

    - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      id: arm-none-eabi-gcc-action
      with:
        release: 13.2.Rel1
    - run: arm-none-eabi-gcc --version

 # Advance Build Steps
    - name: Create Build Environment for Advance
      working-directory: ${{github.workspace}}
      run:  cmake -E make_directory ${{github.workspace}}/build-advance

    - name: Configure CMake for Advance
      shell: bash
      working-directory: ${{github.workspace}}/build-advance
      run: cmake ../sources -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DADV=true

    - name: Build Advance Firmware
      working-directory: ${{github.workspace}}/build-advance
      shell: bash
      run: cmake --build . --config $BUILD_TYPE --parallel $(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: picoTracker_advance
        path: ${{github.workspace}}/build-advance/Adapters/adv/picoTrackerAdvance.bin

    - uses: actions/upload-artifact@v4
      with:
        name: picoTracker_advance_memmap
        path: ${{github.workspace}}/build-advance/picoTrackerAdvance.map